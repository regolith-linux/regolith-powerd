[package]
name = "regolith-powerd"
version = "0.3.3"
edition = "2021"
license = "GPL-3.0+"
authors = ["Soumya Ranjan Patniak <soumyaranjan1812@gmail.com>", "Ken Gilmer <kgilmer@gmail.com>"]
description = "Power Settings Daemeon for Regolith Wayland Session"
repository = "https://github.com/regolith-linux/regolith-powerd"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-channel = "2.1.1"
gio = "0.18.4"
glib = "0.18.5"
gsettings-macro = "0.1.20"
libc = "0.2"
swayipc = "3.0.1"
zbus = "3.15.2"

# The system prompter's secret exchange (Diffie-Hellman, HKDF, AES).
aes = "0.8.4"
base64 = "0.22.1"
cbc = "0.1.2"
hmac = "0.12.1"
num-bigint = "0.4.6"
sha2 = "0.10.8"
